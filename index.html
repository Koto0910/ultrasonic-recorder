<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>超音波測定用 PCM WAV 録音</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 32px auto;
      padding: 0 16px;
      line-height: 1.7;
    }

    button {
      font-size: 18px;
      padding: 10px 18px;
      margin-right: 8px;
    }

    #status {
      white-space: pre-wrap;
      background: #f4f4f4;
      padding: 12px;
      border-radius: 6px;
    }
  </style>
</head>

<body>
  <h2>超音波測定用 PCM WAV 録音</h2>

  <p>
    AGC・エコーキャンセル・ノイズ抑制を無効化して、
    モノラル16-bit PCM WAVで保存します。
  </p>

  <button id="start">録音開始</button>
  <button id="stop" disabled>録音停止・保存</button>

  <h3>状態</h3>
  <pre id="status">待機中</pre>

  <script>
    let stream = null;
    let track = null;
    let context = null;
    let source = null;
    let recorder = null;
    let silentGain = null;
    let workletURL = null;
    let chunks = [];

    const startButton = document.getElementById("start");
    const stopButton = document.getElementById("stop");
    const status = document.getElementById("status");

    function setStatus(message) {
      status.textContent = message;
    }

    function cleanup() {
      if (source) {
        try {
          source.disconnect();
        } catch (_) {}
      }

      if (recorder) {
        try {
          recorder.disconnect();
        } catch (_) {}
      }

      if (silentGain) {
        try {
          silentGain.disconnect();
        } catch (_) {}
      }

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }

      if (workletURL) {
        URL.revokeObjectURL(workletURL);
      }

      stream = null;
      track = null;
      source = null;
      recorder = null;
      silentGain = null;
      workletURL = null;
    }

    function createWav(samples, sampleRate) {
      const buffer = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(buffer);

      function writeString(position, text) {
        for (let i = 0; i < text.length; i++) {
          view.setUint8(position + i, text.charCodeAt(i));
        }
      }

      writeString(0, "RIFF");
      view.setUint32(4, 36 + samples.length * 2, true);
      writeString(8, "WAVE");
      writeString(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);       // PCM
      view.setUint16(22, 1, true);       // モノラル
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeString(36, "data");
      view.setUint32(40, samples.length * 2, true);

      let clippedCount = 0;

      for (let i = 0; i < samples.length; i++) {
        const sample = samples[i];

        if (Math.abs(sample) >= 0.999) {
          clippedCount++;
        }

        const clipped = Math.max(-1, Math.min(1, sample));
        const int16 = clipped < 0
          ? Math.round(clipped * 32768)
          : Math.round(clipped * 32767);

        view.setInt16(44 + i * 2, int16, true);
      }

      return {
        buffer,
        clippedCount
      };
    }

    function createFileName() {
      const now = new Date();

      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, "0");
      const dd = String(now.getDate()).padStart(2, "0");
      const hh = String(now.getHours()).padStart(2, "0");
      const mi = String(now.getMinutes()).padStart(2, "0");
      const ss = String(now.getSeconds()).padStart(2, "0");

      return `ultrasonic_${yyyy}${mm}${dd}_${hh}${mi}${ss}.wav`;
    }

    startButton.onclick = async () => {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error(
            "このブラウザではマイク録音APIが利用できません。ChromeまたはEdgeで開いてください。"
          );
        }

        const supported = navigator.mediaDevices.getSupportedConstraints();
        const requiredConstraints = [
          "autoGainControl",
          "echoCancellation",
          "noiseSuppression"
        ];

        const unsupported = requiredConstraints.filter(
          name => !supported[name]
        );

        if (unsupported.length > 0) {
          throw new Error(
            "このブラウザまたは端末では、次の設定を確認できません: " +
            unsupported.join(", ")
          );
        }

        setStatus("マイクへのアクセスを要求しています…");

        stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            autoGainControl: { exact: false },
            echoCancellation: { exact: false },
            noiseSuppression: { exact: false },

            channelCount: { ideal: 1 },
            sampleRate: { ideal: 48000 },
            sampleSize: { ideal: 16 }
          }
        });

        track = stream.getAudioTracks()[0];
        const settings = track.getSettings();

        const processingDisabled =
          settings.autoGainControl === false &&
          settings.echoCancellation === false &&
          settings.noiseSuppression === false;

        if (!processingDisabled) {
          throw new Error(
            "AGC・エコーキャンセル・ノイズ抑制が無効になったことを確認できません。\n\n" +
            "実際の設定:\n" +
            JSON.stringify(settings, null, 2)
          );
        }

        context = new AudioContext({
          sampleRate: 48000
        });

        await context.resume();

        chunks = [];

        const processorCode = `
          class PCMRecorder extends AudioWorkletProcessor {
            process(inputs) {
              const input = inputs[0];

              if (input && input[0]) {
                this.port.postMessage(input[0].slice());
              }

              return true;
            }
          }

          registerProcessor("pcm-recorder", PCMRecorder);
        `;

        workletURL = URL.createObjectURL(
          new Blob(
            [processorCode],
            { type: "application/javascript" }
          )
        );

        await context.audioWorklet.addModule(workletURL);

        source = context.createMediaStreamSource(stream);
        recorder = new AudioWorkletNode(context, "pcm-recorder");

        // 音をスピーカーへ出さず、処理だけを継続するための無音ノード
        silentGain = context.createGain();
        silentGain.gain.value = 0;

        recorder.port.onmessage = event => {
          chunks.push(event.data);
        };

        source.connect(recorder);
        recorder.connect(silentGain);
        silentGain.connect(context.destination);

        startButton.disabled = true;
        stopButton.disabled = false;

        setStatus(
          "録音中\n\n" +
          "AGC: OFF\n" +
          "エコーキャンセル: OFF\n" +
          "ノイズ抑制: OFF\n\n" +
          `WAV保存用サンプリング周波数: ${context.sampleRate} Hz\n` +
          `マイク側のサンプリング周波数: ${settings.sampleRate ?? "不明"} Hz\n` +
          `チャンネル数: ${settings.channelCount ?? "不明"}\n\n` +
          "録音終了後、「録音停止・保存」を押してください。"
        );

      } catch (error) {
        const message = error instanceof Error
          ? error.message
          : String(error);

        if (context) {
          await context.close();
          context = null;
        }

        cleanup();

        setStatus("録音を開始できませんでした。\n\n" + message);
      }
    };

    stopButton.onclick = async () => {
      try {
        setStatus("WAVファイルを作成しています…");

        source.disconnect();
        recorder.disconnect();
        silentGain.disconnect();

        stream.getTracks().forEach(track => track.stop());

        const sampleRate = context.sampleRate;

        await new Promise(resolve => setTimeout(resolve, 100));

        await context.close();
        context = null;

        const totalLength = chunks.reduce(
          (sum, chunk) => sum + chunk.length,
          0
        );

        const samples = new Float32Array(totalLength);

        let offset = 0;

        for (const chunk of chunks) {
          samples.set(chunk, offset);
          offset += chunk.length;
        }

        const wav = createWav(samples, sampleRate);

        const blob = new Blob(
          [wav.buffer],
          { type: "audio/wav" }
        );

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = url;
        link.download = createFileName();
        link.click();

        setTimeout(() => URL.revokeObjectURL(url), 1000);

        const clipRate = totalLength === 0
          ? 0
          : (wav.clippedCount / totalLength) * 100;

        setStatus(
          "保存完了\n\n" +
          `サンプリング周波数: ${sampleRate} Hz\n` +
          `録音時間: ${(totalLength / sampleRate).toFixed(2)} 秒\n` +
          `クリッピング候補: ${wav.clippedCount} サンプル ` +
          `(${clipRate.toFixed(4)} %)\n\n` +
          (wav.clippedCount > 0
            ? "注意: クリッピング候補があります。送受信距離を離す、または録音入力レベルを確認してください。"
            : "クリッピング候補は検出されませんでした。")
        );

      } catch (error) {
        const message = error instanceof Error
          ? error.message
          : String(error);

        setStatus("保存時にエラーが発生しました。\n\n" + message);

      } finally {
        cleanup();

        startButton.disabled = false;
        stopButton.disabled = true;
      }
    };
  </script>
</body>
</html>
